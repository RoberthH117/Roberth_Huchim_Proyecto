 

<div *ngIf="isLoading" class="loading-spinner">
  <!-- Aquí puedes usar tu componente LoadingSpinnerComponent -->
  <app-loading-spinner></app-loading-spinner>
</div> 

<div class="container">
    <h1>Lista de roles</h1>
    
    
    <table mat-table [dataSource]="licencias" class="table table-striped" *ngIf="!isLoading">

     
      <ng-container matColumnDef="licencia">
        <th mat-header-cell *matHeaderCellDef> Licencia </th>
        <td mat-cell *matCellDef="let licencia">{{ licencia.licencia }}</td>
      </ng-container>
      <ng-container matColumnDef="fecha_inicio">
        <th mat-header-cell *matHeaderCellDef> Fecha_inicio </th>
        <td mat-cell *matCellDef="let licencia">{{ formatFecha(licencia.fecha_Inicio) }}</td>
      </ng-container>
      <ng-container matColumnDef="fecha_expiracion">
        <th mat-header-cell *matHeaderCellDef> Fecha_expiracion </th>
        <td mat-cell *matCellDef="let licencia">{{ formatFecha(licencia.fecha_Expiracion) }}</td>
      </ng-container>
      <ng-container matColumnDef="tiempo">
        <th mat-header-cell *matHeaderCellDef> Tiempo </th>
        <td mat-cell *matCellDef="let licencia">{{ licencia.tiempo }}</td>
      </ng-container>
     
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      
    </table>
    <mat-paginator
    [length]="totalElements"
    [pageSize]="pageSize"
    (page)="onPageChange($event)"
  ></mat-paginator>
  </div>
