<div class="con">
    <mat-card>
        <mat-card-header>
            
            <span>Registro de Producto</span>
        </mat-card-header>
        <mat-icon></mat-icon>
        <mat-card-content>
            <form [formGroup]="form" (ngSubmit)="onSubmit()">
                <mat-label>Nombre:</mat-label>
                <input matInput type="text" id="nombre" formControlName="nombre" placeholder="Escriba el nombre" />
                <p *ngIf="nombre.invalid && (nombre.dirty || nombre.touched)" class="error-message">Nombre es
                    obligatorio</p>

                <mat-label for="apellido">Descripción del Producto:</mat-label>
                <textarea type="text" id="apellido" formControlName="descripcion"
                    placeholder="Escriba una breve Descripción del producto"></textarea>
                <p *ngIf="descripcion && descripcion.invalid && descripcion.errors?.maxlength" class="error-message">La
                    descripción no debe exceder los 200 caracteres</p>

                <div class="container-btn">
                    <button mat-raised-button color="warn" type="button" (click)="cancelar()">Cancelar</button>
                    <button mat-raised-button class="btn-registrar" type="submit">Registrar</button>
                </div>
            </form>

            <div class="error-message-container"></div>
        </mat-card-content>
    </mat-card>
</div>
