
<mat-card>
  <mat-card-header>
    <img src="../../../assets/Logo_blanco_barra_menu.svg" class="logo" alt="Reportar imagen dañada" />
    <span  >Eliminar Usuario</span>
  </mat-card-header>
  
  <mat-dialog-content >
    <h2 color="warn">
      ¿Estás seguro de que quieres eliminar este usuario?

    </h2>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-button [mat-dialog-close]="true" mat-raised-button color="primary">Cancelar</button>
    <button mat-button (click)="Eliminar(usuario.id)" mat-raised-button [mat-dialog-close]="true" color="warn">Eliminar</button>
  </mat-dialog-actions>
  
</mat-card>
