 
<div class="responsive">
    <div fxLayout="row wrap" fxLayoutAlign="start">
      <div fxFlex="100%">
        <mat-card class="card__container">
          <div class="card__header">
            <mat-card-title class="card__title">
              <fieldset>Configuración de CFDI <img src="../../../assets/proceso.png" class="icon-agregar" alt="icon"></fieldset>
            </mat-card-title>
            <br>
            <div class="card__header_actions">
              <mat-card-actions class="mat-pad-none margin-none">
                <button
                  mat-raised-button
                class="create-config-cfdi" 
                  (click)="onInsertConfig_CFDI()"
                >
                  <mat-icon>add_circle</mat-icon> Crear Configuración de CFDI
                </button>
              </mat-card-actions>
            </div>
          </div>
<br>
          <div>
            <div class="table__responsive">
              <table mat-table [dataSource]="dataSource">
              
                <ng-container matColumnDef="cuenta">
                  <th mat-header-cell *matHeaderCellDef>Cuenta</th>
                  <td mat-cell *matCellDef="let element">
                    {{ element.cuenta }}
                  </td>
                </ng-container>
  
               
  
                <ng-container matColumnDef="fecha">
                  <th mat-header-cell *matHeaderCellDef>Fecha de Creación de Configuración</th>
                  <td mat-cell *matCellDef="let element">
                    {{ element.lastModifiedOn | date:'mediumDate' }}  
                  </td>
                </ng-container>
                
                
  
                <ng-container matColumnDef="action">
                  <th
                    mat-header-cell
                    *matHeaderCellDef
                    style="text-align: center"
                  >
                    Acción
                  </th>
                  <td
                    mat-cell
                    *matCellDef="let element; let i = index"
                    class="table__actions"
                  >
                    <button class="btn-action btn-edit"
                      mat-flat-button
                       
                      (click)="onUpdateConfig_CFDI(element.id )"
                    >
                      <mat-icon>create</mat-icon>
                    </button>
                    <button
                      mat-flat-button
                      color="warn"
                      (click)="OnDeletConfig_CFDI(element.id)"
                    >
                      <mat-icon>delete</mat-icon>
                    </button>
                  </td>
                </ng-container>
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
              </table>
            </div>
            <mat-paginator
              [length]="5"
              [pageSize]="10"
              [pageSizeOptions]="[5, 10, 25, 100]"
              aria-label="Select page"
            >
            </mat-paginator>
          </div>
        </mat-card>
      </div>
    </div>
  </div>
